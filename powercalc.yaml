  sensors:
    # Ecobee thermostat controlled HVAC systems. The power values are currently estimated, and need to be measured to refine.
    # Main House HVAC System 
    - entity_id: climate.main_house_thermostat_cloud # only the cloud version from the ecobee integration exposes the states_power attribute
      name: Main House HVAC System
      fixed:
        power: 20
        states_power:
          equipment_running|fan: 400 # fan only
          equipment_running|auxHeat1,fan: 9000 # Heat (Electric Strips Stage 1)
          #equipment_running|auxHeat1,auxHeat2,fan: 12000 # Heat (Electric Strips Stage 1+2) Stage 2 is disabled by circuit breaker, so this state is not used
          equipment_running|heatPump,fan: 3500 # Heat (Heat Pump)
          equipment_running|heatPump,auxHeat1,fan: 12500 # Heat (Heat Pump + Electric Strips Stage 1)
          #equipment_running|heatPump,auxHeat1,auxHeat2,fan: 15500 # Heat (Heat Pump + Electric Strips Stage 1+2) Stage 2 is disabled by circuit breaker, so this state is not used
          equipment_running|compCool1,fan: 3500 # AC

    # North Wing HVAC System 
    - entity_id: climate.north_wing_thermostat_cloud # only the cloud version from the ecobee integration exposes the states_power attribute
      name: North Wing HVAC System
      fixed:
        power: 20
        states_power:
          equipment_running|fan: 250 # fan only
          equipment_running|auxHeat1,fan: 6000 # Heat (Electric Strips Stage 1)
          #equipment_running|auxHeat1,auxHeat2,fan: 8000 # Heat (Electric Strips Stage 1+2) Stage 2 is disabled by circuit breaker, so this state is not used
          equipment_running|heatPump,fan: 2500 # Heat (Heat Pump)
          equipment_running|heatPump,auxHeat1,fan: 8500 # Heat (Heat Pump + Electric Strips Stage 1)
          #equipment_running|heatPump,auxHeat1,auxHeat2,fan: 10500 # Heat (Heat Pump + Electric Strips Stage 1+2) Stage 2 is disabled by circuit breaker, so this state is not used
          equipment_running|compCool1,fan: 2500 # AC

    # Mud Room HVAC System 
    - entity_id: climate.mud_room_thermostat_cloud # only the cloud version from the ecobee integration exposes the states_power attribute
      name: Mud Room HVAC System
      fixed:
        power: 20
        states_power:
          equipment_running|fan: 250 # fan only
          equipment_running|auxHeat1,fan: 6000 # Heat (Electric Strips Stage 1)
          #equipment_running|auxHeat1,auxHeat2,fan: 8000 # Heat (Electric Strips Stage 1+2) Stage 2 is disabled by circuit breaker, so this state is not used
          equipment_running|heatPump,fan: 2500 # Heat (Heat Pump)
          equipment_running|heatPump,auxHeat1,fan: 8500 # Heat (Heat Pump + Electric Strips Stage 1)
          #equipment_running|heatPump,auxHeat1,auxHeat2,fan: 10500 # Heat (Heat Pump + Electric Strips Stage 1+2) Stage 2 is disabled by circuit breaker, so this state is not used
          equipment_running|compCool1,fan: 2500 # AC
